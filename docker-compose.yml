x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - ./deploy/postgres/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 320m
    cpus: 0.50
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: vaguiiinho/store-api:1.0.2
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-store}:${POSTGRES_PASSWORD:-store}@postgres:5432/${POSTGRES_DB:-store}?schema=public
      NODE_OPTIONS: --max-old-space-size=192
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    expose:
      - "3001"
    restart: unless-stopped
    mem_limit: 300m
    cpus: 0.50
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    image: vaguiiinho/store-web:1.0.2
    env_file:
      - ./apps/web/.env
    environment:
      NODE_OPTIONS: --max-old-space-size=224
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    expose:
      - "3000"
    restart: unless-stopped
    mem_limit: 320m
    cpus: 0.50
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "82:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    logging: *default-logging

volumes:
  postgres_data:
